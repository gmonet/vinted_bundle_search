name: Release

# Push a tag vX.Y.Z (matching package.json) to publish the userscript (and the signed APK when
# the ANDROID_* signing secrets are configured). Without the secrets, build and upload the signed
# APK locally: scripts/release-apk.sh vX.Y.Z (see docs/fdroid.md).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Signed release APK (if signing secrets are configured)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PW" "$KEY_ALIAS" "$KEY_PW" > keystore.properties
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "../vinted-bundle-search-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/vinted-bundle-search.user.js
            vinted-bundle-search-*.apk
